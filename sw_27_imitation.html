<h2>Punkt:</h2>
<p>[Namn] imiterade handlingar, beteenden eller ljud.</p>

<h2>Förklaring:</h2>
<p>Härmar vad andra personer gör eller säger.</p>
<h2>Exempel:</h2>
<ul>
<li>Gör samma handrörelser som någon annan</li><li>Upprepar fraser som barnet hör</li><li>Försöker använda bestick efter att ha sett andra äta</li><li>Härmar dansrörelser</li>
</ul>
